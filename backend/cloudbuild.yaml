steps:
  # Deploy directly from source to Cloud Run (no Artifact Registry storage)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'fitness-tracker-api'
      - '--source'
      - '.'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8000'
      - '--memory'
      - '512Mi'
      - '--timeout'
      - '60s'
      - '--cpu-boost'
      - '--set-env-vars'
      - 'FIREBASE_PROJECT_ID=$PROJECT_ID,CORS_ORIGINS_STR=https://fitness-demo-8be1a.web.app,DEBUG=false'
      - '--set-secrets'
      - 'GOOGLE_CLIENT_ID=google-client-id:latest,GOOGLE_CLIENT_SECRET=google-client-secret:latest,GOOGLE_FIT_ENCRYPTION_KEY=google-fit-encryption-key:latest'

  # Cleanup: Delete container images from Artifact Registry to save storage
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        # Delete all images for this service from the cloud-run-source-deploy repository
        gcloud artifacts docker images delete \
          us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/fitness-tracker-api \
          --delete-tags --quiet || echo "No images to clean up"
